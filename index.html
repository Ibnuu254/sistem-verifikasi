<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arsip Kata Perang</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #000;
    color: #00ff41;
    font-family: Arial, sans-serif;
    height: 100vh;
    overflow: hidden;
    cursor: grab;
    user-select: none;
  }

  body.dragging { cursor: grabbing; }

  /* ============================================
     HALAMAN UTAMA (HACKER)
     ============================================ */
  #mainPage {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: opacity 0.5s ease;
  }

  #logoBg {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 320px;
    height: 320px;
    opacity: 0.22;
    z-index: 0;
    pointer-events: none;
    animation: creepyPulse 3s ease-in-out infinite;
  }

  @keyframes creepyPulse {
    0%, 100% { opacity: 0.18; transform: translate(-50%, -50%) scale(1); }
    50%      { opacity: 0.32; transform: translate(-50%, -50%) scale(1.03); }
    47%      { opacity: 0.10; transform: translate(-50%, -50%) scale(1) translateX(3px); }
    53%      { opacity: 0.30; transform: translate(-50%, -50%) scale(1) translateX(-3px); }
  }

  #binaryBg {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
    pointer-events: none;
    opacity: 0.6;
  }

  h1 {
    position: fixed;
    top: 20px;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 20px;
    color: #00ff41;
    margin: 0;
    z-index: 3;
    letter-spacing: 3px;
    font-family: Arial, sans-serif;
  }

  #scene {
    width: 100%;
    height: 100%;
    perspective: 1200px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    z-index: 2;
  }

  .qr-container {
    width: 240px;
    height: 240px;
    position: relative;
    transform-style: preserve-3d;
  }

  .qr-card {
    width: 240px;
    height: 240px;
    position: relative;
    transform-style: preserve-3d;
  }

  .qr-face {
    position: absolute;
    width: 240px;
    height: 240px;
    background: #fff;
    border: 4px solid #00ff41;
    box-shadow: 0 0 25px rgba(0, 255, 65, 0.8),
                inset 0 0 10px rgba(0, 0, 0, 0.2);
    overflow: hidden;
    padding: 6px;
    cursor: pointer;
    transition: box-shadow 0.3s;
  }

  .qr-face:hover {
    box-shadow: 0 0 45px rgba(0, 255, 65, 1),
                inset 0 0 10px rgba(0, 0, 0, 0.2);
  }

  .qr-face img {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: contain;
    image-rendering: pixelated;
    pointer-events: none;
  }

  .front  { transform: translateZ(120px); }
  .back   { transform: rotateY(180deg) translateZ(120px); }
  .right  { transform: rotateY(90deg) translateZ(120px); }
  .left   { transform: rotateY(-90deg) translateZ(120px); }
  .top    { transform: rotateX(90deg) translateZ(120px); }
  .bottom { transform: rotateX(-90deg) translateZ(120px); }

  .scan-line {
    position: absolute;
    left: 0;
    right: 0;
    height: 3px;
    background: linear-gradient(90deg, transparent, #00ff41, #fff, #00ff41, transparent);
    box-shadow: 0 0 20px #00ff41;
    animation: scan 2s linear infinite;
    pointer-events: none;
    z-index: 5;
  }

  @keyframes scan {
    0%   { top: 0%; }
    100% { top: 100%; }
  }

  .buttons {
    position: fixed;
    bottom: 20px;
    left: 0;
    right: 0;
    text-align: center;
    z-index: 3;
  }

  button {
    background: #000;
    color: #00ff41;
    border: 2px solid #00ff41;
    padding: 10px 20px;
    font-size: 14px;
    font-family: Arial, sans-serif;
    cursor: pointer;
    margin: 0 5px;
    transition: all 0.2s;
  }

  button:hover {
    background: #00ff41;
    color: #000;
  }

  .info {
    position: fixed;
    bottom: 70px;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 11px;
    color: #00ff41;
    opacity: 0.6;
    z-index: 3;
    letter-spacing: 1px;
    font-family: Arial, sans-serif;
  }

  /* ============================================
     HALAMAN KATA PERANG
     ============================================ */
  #warPage {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: none;
    align-items: center;
    justify-content: center;
    background: #1a0000;
    overflow: hidden;
    cursor: default;
  }

  #warPage.active {
    display: flex;
    animation: fadeIn 0.6s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to   { opacity: 1; }
  }

  /* Background animasi perang */
  #warBg {
    position: absolute;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    background:
      radial-gradient(ellipse at bottom, rgba(139, 0, 0, 0.6) 0%, transparent 60%),
      radial-gradient(ellipse at top, rgba(80, 0, 0, 0.4) 0%, transparent 50%),
      linear-gradient(180deg, #0a0000 0%, #1a0000 50%, #2a0505 100%);
  }

  #warBg::before {
    content: '';
    position: absolute;
    inset: 0;
    background:
      radial-gradient(circle at 20% 80%, rgba(255, 100, 0, 0.18) 0%, transparent 30%),
      radial-gradient(circle at 80% 70%, rgba(255, 50, 0, 0.15) 0%, transparent 35%),
      radial-gradient(circle at 50% 90%, rgba(200, 0, 0, 0.2) 0%, transparent 40%);
    animation: smokeMove 8s ease-in-out infinite alternate;
  }

  @keyframes smokeMove {
    0%   { transform: translateX(-3%) translateY(0) scale(1); }
    100% { transform: translateX(3%) translateY(-2%) scale(1.05); }
  }

  #warBg::after {
    content: '';
    position: absolute;
    inset: 0;
    background-image:
      repeating-linear-gradient(0deg, transparent 0 2px, rgba(0,0,0,0.15) 2px 3px),
      repeating-linear-gradient(90deg, transparent 0 2px, rgba(0,0,0,0.1) 2px 3px);
    opacity: 0.5;
  }

  /* Kartu kutipan */
  .war-card {
    position: relative;
    z-index: 2;
    background: rgba(20, 0, 0, 0.85);
    backdrop-filter: blur(10px);
    border: 2px solid #ff3b3b;
    border-radius: 8px;
    padding: 45px 40px;
    max-width: 600px;
    width: 90%;
    text-align: center;
    color: #ffcccc;
    box-shadow:
      0 0 30px rgba(255, 50, 50, 0.5),
      inset 0 0 40px rgba(100, 0, 0, 0.6);
    animation: cardFlicker 4s ease-in-out infinite;
  }

  @keyframes cardFlicker {
    0%, 100% { box-shadow: 0 0 30px rgba(255, 50, 50, 0.5), inset 0 0 40px rgba(100, 0, 0, 0.6); }
    50%      { box-shadow: 0 0 45px rgba(255, 50, 50, 0.8), inset 0 0 60px rgba(150, 0, 0, 0.8); }
  }

  /* Tanda kutip besar */
  .quote-mark {
    font-size: 70px;
    color: #8b0000;
    line-height: 0.8;
    font-family: Georgia, serif;
    text-shadow: 0 0 20px #ff0000;
    margin-bottom: -10px;
  }

  .quote-icon {
    font-size: 40px;
    margin-bottom: 10px;
    display: inline-block;
    animation: pulse 2s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { transform: scale(1); opacity: 1; }
    50%      { transform: scale(1.1); opacity: 0.85; }
  }

  /* Kutipan */
  .war-quote {
    font-size: 20px;
    line-height: 1.6;
    font-style: italic;
    color: #ffdddd;
    text-shadow: 0 0 10px rgba(255, 50, 50, 0.6);
    margin: 20px 0;
    font-family: Georgia, serif;
    letter-spacing: 0.5px;
  }

  /* Garis pemisah */
  .war-divider {
    width: 100px;
    height: 2px;
    background: linear-gradient(90deg, transparent, #ff3b3b, transparent);
    margin: 20px auto;
    box-shadow: 0 0 10px #ff3b3b;
  }

  /* Nama tokoh */
  .war-author {
    font-size: 16px;
    color: #ff5555;
    font-weight: bold;
    letter-spacing: 3px;
    text-transform: uppercase;
    text-shadow: 0 0 10px #ff0000;
    margin-top: 15px;
    font-family: 'Courier New', monospace;
  }

  /* Info tokoh */
  .war-role {
    font-size: 12px;
    color: #ffaa00;
    letter-spacing: 2px;
    margin-top: 8px;
    font-family: 'Courier New', monospace;
  }

  /* Konteks kutipan */
  .war-context {
    font-size: 12px;
    color: #cc8888;
    margin-top: 20px;
    font-style: italic;
    line-height: 1.5;
    opacity: 0.85;
  }

  .back-btn {
    background: rgba(139, 0, 0, 0.4);
    color: #ff3b3b;
    border: 2px solid #ff3b3b;
    padding: 12px 30px;
    font-size: 13px;
    font-family: 'Courier New', monospace;
    cursor: pointer;
    letter-spacing: 3px;
    transition: all 0.3s;
    margin-top: 25px;
    border-radius: 4px;
  }

  .back-btn:hover {
    background: #ff3b3b;
    color: #000;
    box-shadow: 0 0 25px #ff3b3b;
  }

  /* Scan line gelap */
  .war-scanline {
    position: absolute;
    left: 0;
    right: 0;
    height: 4px;
    background: linear-gradient(90deg, transparent, rgba(255, 50, 50, 0.5), transparent);
    animation: warScan 4s linear infinite;
    z-index: 3;
    pointer-events: none;
  }

  @keyframes warScan {
    0%   { top: -5%; opacity: 0; }
    10%  { opacity: 1; }
    90%  { opacity: 1; }
    100% { top: 105%; opacity: 0; }
  }

  /* Percikan api */
  .spark {
    position: absolute;
    width: 3px;
    height: 3px;
    background: #ffaa00;
    border-radius: 50%;
    box-shadow: 0 0 8px #ff6600;
    pointer-events: none;
    z-index: 1;
  }
</style>
</head>
<body>

<!-- ============================================
     HALAMAN UTAMA
     ============================================ -->
<div id="mainPage">

  <svg id="logoBg" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <filter id="glitch">
        <feGaussianBlur stdDeviation="1" result="blur"/>
        <feOffset in="blur" dx="3" dy="0" result="o1"/>
        <feOffset in="blur" dx="-3" dy="0" result="o2"/>
        <feMerge>
          <feMergeNode in="o1"/>
          <feMergeNode in="o2"/>
          <feMergeNode in="SourceGraphic"/>
        </feMerge>
      </filter>
    </defs>
    <polygon points="200,10 365,105 365,295 200,390 35,295 35,105"
             fill="none" stroke="#00ff41" stroke-width="8"/>
    <polygon points="200,55 330,132 330,268 200,345 70,268 70,132"
             fill="none" stroke="#00ff41" stroke-width="4" opacity="0.8"/>
    <polygon points="200,100 295,155 295,245 200,300 105,245 105,155"
             fill="none" stroke="#00ff41" stroke-width="2" opacity="0.5"/>
    <polygon points="200,75 320,295 80,295"
             fill="none" stroke="#00ff41" stroke-width="5"/>
    <polygon points="200,110 290,280 110,280"
             fill="none" stroke="#00ff41" stroke-width="2" opacity="0.7"/>
    <path d="M 115,90 Q 80,90 80,135 L 80,175 Q 80,200 55,200 Q 80,200 80,225 L 80,265 Q 80,310 115,310"
          fill="none" stroke="#00ff41" stroke-width="8" stroke-linecap="round" filter="url(#glitch)"/>
    <path d="M 285,90 Q 320,90 320,135 L 320,175 Q 320,200 345,200 Q 320,200 320,225 L 320,265 Q 320,310 285,310"
          fill="none" stroke="#00ff41" stroke-width="8" stroke-linecap="round" filter="url(#glitch)"/>
    <circle cx="200" cy="10" r="4" fill="#00ff41"/>
    <circle cx="365" cy="105" r="4" fill="#00ff41"/>
    <circle cx="365" cy="295" r="4" fill="#00ff41"/>
    <circle cx="200" cy="390" r="4" fill="#00ff41"/>
    <circle cx="35" cy="295" r="4" fill="#00ff41"/>
    <circle cx="35" cy="105" r="4" fill="#00ff41"/>
  </svg>

  <canvas id="binaryBg"></canvas>

  <h1>ARSIP KATA PERANG</h1>

  <div id="scene">
    <div class="qr-container">
      <div class="qr-card" id="qrCard">
        <div class="qr-face front"  data-side="0"><img alt="QR"><div class="scan-line"></div></div>
        <div class="qr-face back"   data-side="1"><img alt="QR"><div class="scan-line"></div></div>
        <div class="qr-face right"  data-side="2"><img alt="QR"><div class="scan-line"></div></div>
        <div class="qr-face left"   data-side="3"><img alt="QR"><div class="scan-line"></div></div>
        <div class="qr-face top"    data-side="4"><img alt="QR"><div class="scan-line"></div></div>
        <div class="qr-face bottom" data-side="5"><img alt="QR"><div class="scan-line"></div></div>
      </div>
    </div>
  </div>

  <div class="info">📱 Scan QR atau klik untuk dengar kata mereka ⚔️</div>

  <div class="buttons">
    <button id="spinBtn">Putar Otomatis</button>
    <button id="stopBtn">Stop</button>
    <button id="randomBtn">Acak Kutipan</button>
  </div>
</div>

<!-- ============================================
     HALAMAN KATA PERANG
     ============================================ -->
<div id="warPage">
  <div id="warBg"></div>
  <div class="war-scanline"></div>

  <div class="war-card">
    <div class="quote-mark">"</div>
    <div class="quote-icon" id="warIcon">⚔️</div>
    <div class="war-quote" id="warQuote">...</div>
    <div class="war-divider"></div>
    <div class="war-author" id="warAuthor">— Tokoh</div>
    <div class="war-role" id="warRole">Jenderal</div>
    <div class="war-context" id="warContext">...</div>
    <button class="back-btn" id="backBtn">← KEMBALI</button>
  </div>
</div>

<script>
  // ============================================
  // 📚 DAFTAR KATA-KATA TOKOH PERANG (EDIT DI SINI)
  // ============================================
  const WAR_QUOTES = [
    {
      icon: "⚔️",
      quote: "Veni, vidi, vici. — Aku datang, aku lihat, aku menang.",
      author: "Julius Caesar",
      role: "Kaisar Romawi",
      context: "Diucapkan setelah kemenangan cepat dalam Perang Zela, 47 SM. Tiga kata yang mengguncang dunia."
    },
    {
      icon: "🇬🇧",
      quote: "Kami akan bertarung di pantai, kami akan bertarung di darat, kami akan bertarung di ladang dan di jalanan. Kami tidak akan pernah menyerah.",
      author: "Winston Churchill",
      role: "Perdana Menteri Inggris",
      context: "Pidato legendaris 4 Juni 1940 di depan Parlemen, saat Inggris terancam invasi Nazi Jerman."
    },
    {
      icon: "🔥",
      quote: "Perang adalah neraka.",
      author: "William Tecumseh Sherman",
      role: "Jenderal Union, Perang Sipil AS",
      context: "Kalimat yang diucapkan tahun 1879. Simple tapi menusuk — menggambarkan kengerian perang sebenarnya."
    },
    {
      icon: "🇻🇳",
      quote: "Aku tidak akan menjadi orang pertama yang kehilangan Vietnam, dan aku tidak akan menjadi orang terakhir yang kehilangan Amerika.",
      author: "Richard Nixon",
      role: "Presiden AS ke-37",
      context: "Disampaikan saat Perang Vietnam memanas, 1969. Menunjukkan dilema politik dalam perang yang tak berujung."
    },
    {
      icon: "🎖️",
      quote: "Prajurit yang baik tidak bertanya mengapa, ia hanya bertanya ke mana.",
      author: "Sun Tzu",
      role: "Jenderal & Filsuf Perang, Tiongkok Kuno",
      context: "Dari kitab 'The Art of War' (Seni Berperang). Buku yang masih dipelajari militer dunia hingga kini."
    },
    {
      icon: "⚡",
      quote: "Kemerdekaan tidak pernah diberikan. Ia harus diperjuangkan.",
      author: "Aung San Suu Kyi",
      role: "Aktivis Kemerdekaan Myanmar",
      context: "Kata-kata yang menjadi semangat perjuangan banyak bangsa, termasuk Indonesia melawan penjajah."
    }
  ];

  // ============================================
  // BACKGROUND BINER
  // ============================================
  const canvas = document.getElementById('binaryBg');
  const ctx = canvas.getContext('2d');
  let columns = [];
  const fontSize = 16;

  function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    const colCount = Math.floor(canvas.width / fontSize);
    columns = [];
    for (let i = 0; i < colCount; i++) {
      columns.push({
        x: i * fontSize,
        y: Math.random() * canvas.height,
        speed: 1 + Math.random() * 2
      });
    }
  }

  function drawBinary() {
    ctx.fillStyle = 'rgba(0, 0, 0, 0.08)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.font = fontSize + 'px monospace';
    ctx.fillStyle = '#00ff41';
    columns.forEach(col => {
      const bit = Math.random() > 0.5 ? '1' : '0';
      ctx.fillText(bit, col.x, col.y);
      col.y += col.speed * fontSize * 0.3;
      if (col.y > canvas.height + fontSize) {
        col.y = -fontSize;
        col.speed = 1 + Math.random() * 2;
      }
    });
  }

  resizeCanvas();
  window.addEventListener('resize', resizeCanvas);
  setInterval(drawBinary, 50);

  // ============================================
  // GENERATE QR
  // ============================================
  const BASE_URL = 'https://ibnuu254.github.io/sistem-verifikasi';

  function qrUrl(text, size) {
    const s = size || 400;
    return 'https://api.qrserver.com/v1/create-qr-code/?size=' + s + 'x' + s +
           '&data=' + encodeURIComponent(text) +
           '&color=000000&bgcolor=FFFFFF&margin=0&ecc=H';
  }

  function renderAllQR() {
    document.querySelectorAll('[data-side]').forEach(faceEl => {
      const side = faceEl.dataset.side;
      const img = faceEl.querySelector('img');
      if (img) {
        img.src = qrUrl(BASE_URL + '#war=' + side, 400);
      }
    });
  }

  renderAllQR();

  // ============================================
  // QR 3D - DRAG
  // ============================================
  const qrCard = document.getElementById('qrCard');
  const body = document.body;

  let rotX = -10, rotY = 20;
  let isDragging = false;
  let lastX = 0, lastY = 0;
  let autoSpin = false;

  function updateQR() {
    qrCard.style.transform = `rotateX(${rotX}deg) rotateY(${rotY}deg)`;
  }

  body.addEventListener('mousedown', (e) => {
    if (e.target.closest('#warPage')) return;
    isDragging = true;
    body.classList.add('dragging');
    lastX = e.clientX;
    lastY = e.clientY;
  });

  body.addEventListener('mousemove', (e) => {
    if (!isDragging) return;
    rotY += (e.clientX - lastX) * 0.5;
    rotX -= (e.clientY - lastY) * 0.5;
    lastX = e.clientX;
    lastY = e.clientY;
    updateQR();
  });

  body.addEventListener('mouseup', () => {
    isDragging = false;
    body.classList.remove('dragging');
  });

  document.getElementById('spinBtn').onclick = () => { autoSpin = true; };
  document.getElementById('stopBtn').onclick = () => { autoSpin = false; };
  document.getElementById('randomBtn').onclick = () => {
    WAR_QUOTES.sort(() => Math.random() - 0.5);
  };

  function loop() {
    if (autoSpin && !isDragging) {
      rotY += 1;
      rotX += 0.4;
      updateQR();
    }
    requestAnimationFrame(loop);
  }
  loop();
  updateQR();

  // ============================================
  // KLIK QR → BUKA KUTIPAN
  // ============================================
  document.querySelectorAll('[data-side]').forEach(faceEl => {
    faceEl.addEventListener('click', () => {
      const side = parseInt(faceEl.dataset.side);
      openWarPage(side);
    });
  });

  // ============================================
  // EFEK PERCIKAN API
  // ============================================
  const warPage = document.getElementById('warPage');
  let sparkInterval = null;

  function createSpark() {
    const spark = document.createElement('div');
    spark.className = 'spark';
    spark.style.left = Math.random() * 100 + '%';
    spark.style.top = (60 + Math.random() * 40) + '%';
    warPage.appendChild(spark);

    const duration = 1500 + Math.random() * 2000;
    const driftX = (Math.random() - 0.5) * 100;
    const driftY = -(200 + Math.random() * 300);

    spark.animate([
      { transform: 'translate(0, 0) scale(1)', opacity: 1 },
      { transform: `translate(${driftX}px, ${driftY}px) scale(0)`, opacity: 0 }
    ], {
      duration: duration,
      easing: 'ease-out'
    }).onfinish = () => spark.remove();
  }

  function startSparks() {
    if (sparkInterval) return;
    sparkInterval = setInterval(createSpark, 200);
  }

  function stopSparks() {
    if (sparkInterval) {
      clearInterval(sparkInterval);
      sparkInterval = null;
    }
    warPage.querySelectorAll('.spark').forEach(s => s.remove());
  }

  // ============================================
  // OPEN / CLOSE KUTIPAN
  // ============================================
  function openWarPage(sideIndex) {
    const data = WAR_QUOTES[sideIndex % WAR_QUOTES.length];

    document.getElementById('warIcon').textContent = data.icon;
    document.getElementById('warQuote').textContent = data.quote;
    document.getElementById('warAuthor').textContent = '— ' + data.author;
    document.getElementById('warRole').textContent = data.role;
    document.getElementById('warContext').textContent = data.context;

    warPage.classList.add('active');
    document.getElementById('mainPage').style.opacity = '0';
    startSparks();
  }

  function closeWarPage() {
    warPage.classList.remove('active');
    document.getElementById('mainPage').style.opacity = '1';
    stopSparks();
  }

  document.getElementById('backBtn').addEventListener('click', closeWarPage);

  // ============================================
  // CEK URL: #war=N
  // ============================================
  function checkHash() {
    const hash = window.location.hash;
    const match = hash.match(/#war=(\d+)/);
    if (match) {
      const side = parseInt(match[1]);
      setTimeout(() => openWarPage(side), 500);
    } else {
      closeWarPage();
    }
  }

  window.addEventListener('hashchange', checkHash);
  window.addEventListener('load', checkHash);
</script>

</body>
</html>
